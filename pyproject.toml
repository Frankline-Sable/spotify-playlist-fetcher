[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "playlist-fetcher"
version = "0.1.0"
description = "A macOS-friendly playlist metadata and authorized audio download CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
playlist-fetcher = "playlist_fetcher.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
